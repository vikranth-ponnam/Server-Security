<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ClaimWatch AI – Insurance Fraud Detection</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <style>
    :root{--primary:#1a237e;--accent:#e53935;--light:#e8eaf6;}
    body{background:#f5f6fa;font-family:'Segoe UI',sans-serif;}
    .navbar{background:var(--primary)!important;}
    .navbar-brand{font-weight:700;font-size:1.3rem;letter-spacing:.5px;}
    .sidebar{background:var(--primary);min-height:100vh;padding-top:2rem;}
    .sidebar .nav-link{color:rgba(255,255,255,.75);padding:.7rem 1.2rem;border-radius:8px;margin:.2rem .5rem;transition:.2s;}
    .sidebar .nav-link:hover,.sidebar .nav-link.active{background:rgba(255,255,255,.15);color:#fff;}
    .sidebar .nav-link i{width:22px;}
    .card{border:none;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.07);}
    .card-header{border-radius:14px 14px 0 0!important;font-weight:600;}
    .badge-high{background:#e53935;}
    .badge-med{background:#fb8c00;}
    .badge-low{background:#43a047;}
    footer{background:var(--primary);color:rgba(255,255,255,.7);font-size:.85rem;}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-dark navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/"><i class="fas fa-shield-alt me-2"></i>ClaimWatch AI</a>
    <span class="navbar-text text-white-50 small">Insurance Fraud Detection Platform</span>
    <div class="ms-auto">
      <a class="btn btn-outline-light btn-sm me-2" href="/predict"><i class="fas fa-search me-1"></i>Analyse Claim</a>
      <a class="btn btn-light btn-sm" href="/dashboard"><i class="fas fa-chart-bar me-1"></i>Dashboard</a>
    </div>
  </div>
</nav>

{% block content %}{% endblock %}

<footer class="text-center py-3 mt-5">
  <p class="mb-0">GenAI Forge 2026 &nbsp;|&nbsp; ClaimWatch AI &nbsp;|&nbsp; Built with Python, Flask &amp; XGBoost</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
